[workspace]
members = ["cdc", "store", "cli", "db", "mountfs", "spillcache"]
resolver = "2"

# Tuned for a production release binary: strip removes rustc-embedded debug
# symbols from the .exe itself (Windows/MSVC still splits the bulk of debug
# info into a separate .pdb regardless - this only trims what Cargo's
# default profile leaves behind on top of that); lto + codegen-units = 1
# trade slower, single-threaded builds for better cross-crate inlining and
# dead-code elimination. Only shaved ~200 KB off this project's ~3.5 MB
# `backup.exe` in practice (most of the size is the statically-linked
# dependencies themselves, not missed optimization), but there's no
# downside for a release build that isn't rebuilt often.
[profile.release]
strip = true
lto = true
codegen-units = 1
