date: 2026-08-28
machine: julius
environment: wsl2
power_profile: power-saver             # Balanced base scheme, OVERLAY_SCHEME_MIN overlay on the Windows host, WSL2 shares it
io_device: local-ssd
dfs_build: n/a (native filesystem baseline, no DedupFS code exercised)
operation: dir-listing
location: native
tool: ls -U (WSL2 coreutils, one process per listing)
mode: sequential
parallel_n:
window_seconds: 20
scale: 50000                      # fixed listing-directory size (entries), built once, not per-run
content_size:
result:
  unit: ops_per_second
  mean: 33.8
  range: [32, 35]
  n: 5
  discarded_warmup_run: false
