notes: >
  A/B against ../measurements/2026-09-01-julius-db-direct-mkdir-native.yaml (same tool/machine/
  power profile/IO device, no code differences besides being on branch write-cache, which adds
  DESIGN-MOUNT-017's in-memory name cache). Baseline showed a monotonic decline (428.0 -> 108.5
