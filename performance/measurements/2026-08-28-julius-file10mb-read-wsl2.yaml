date: 2026-08-28
machine: julius
environment: wsl2
power_profile: power-saver             # Balanced base scheme, OVERLAY_SCHEME_MIN overlay on the Windows host, WSL2 shares it
io_device: local-ssd
dfs_build: n/a (native filesystem baseline, no DedupFS code exercised)
operation: read-file-10mb
location: native
tool: cat to /dev/null (WSL2 coreutils)
mode: sequential
parallel_n:
window_seconds: 20
scale: 3552                       # total reads across the 5 kept runs, against a fixed 2,005-file set
content_size: 10485760
result:
  unit: ops_per_second
  mean: 35.0
  range: [30, 37]
  n: 5
  discarded_warmup_run: false
