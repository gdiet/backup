[global]
    workgroup = WORKGROUP
    server string = dedup-backup
    security = user
    server min protocol = SMB2
    log file = /var/log/samba/log.%m
    max log size = 50
    load printers = no
    printcap name = /dev/null
    disable spoolss = yes

[dedup]
    path = /mnt/dedup
    browsable = yes
    read only = yes
    # backup mount runs as root inside the container and doesn't pass FUSE's
    # `allow_other` option (single-user tool by design), so the FUSE mount
    # is only accessible to root regardless of the mounted files' reported
    # permission bits - smbd otherwise runs filesystem operations as the
    # authenticated SMB user, which would get a kernel-level "permission
    # denied" on chdir/open before even reaching this filesystem's own
    # logic. `force user` sidesteps that entirely: SMB auth still requires
    # a valid user/password, but actual file access always runs as root.
    force user = root
