[global]
    workgroup = WORKGROUP
    server string = dedup-backup
    security = user
    server min protocol = SMB2
    log file = /var/log/samba/log.%m
    max log size = 50
    load printers = no
    printcap name = /dev/null
    disable spoolss = yes

[dedup]
    path = /mnt/dedup
    browsable = yes
    # `read only = no` - not because this share should always be writable
    # (the *default* mount, no MOUNT_ARGS, is read-only), but because real
    # read-only enforcement already happens one layer down, at the
    # FUSE/kernel level: `backup mount` passes libfuse's own `-oro`
    # whenever `--read-write` isn't given, which the kernel enforces - any
    # write syscall gets EROFS regardless of what smbd does. Leaving *this*
    # setting at Samba's own default (confirmed via `testparm -v`: `read
    # only = Yes`, not `No` - omitting the line entirely still leaves
    # writes blocked, it does not fall through to "writable") duplicates
    # that enforcement statically, blind to `MOUNT_ARGS` - which silently
    # broke `--read-write`: smbd rejected every write with
    # NT_STATUS_ACCESS_DENIED before it ever reached the (already
    # read-write) FUSE mount, confirmed by a real authenticated `smbclient
    # put` against a `--read-write` mount. `read only = no` here just
    # removes Samba's own redundant, MOUNT_ARGS-blind copy of that check -
    # a real read-only mount (`--read-write` absent) still correctly
    # rejects the write, now via a real EROFS from the FUSE layer instead
    # of a Samba-layer denial that didn't know the difference.
    read only = no
    # backup mount runs as root inside the container and doesn't pass FUSE's
    # `allow_other` option (single-user tool by design), so the FUSE mount
    # is only accessible to root regardless of the mounted files' reported
    # permission bits - smbd otherwise runs filesystem operations as the
    # authenticated SMB user, which would get a kernel-level "permission
    # denied" on chdir/open before even reaching this filesystem's own
    # logic. `force user` sidesteps that entirely: SMB auth still requires
    # a valid user/password, but actual file access always runs as root.
    force user = root
