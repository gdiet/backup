[package]
name = "cli"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true

[[bin]]
name = "dfs"
path = "src/main.rs"

[dependencies]
blake3 = "1.8.7"
cdc = { version = "0.0.1", path = "../cdc" }
clap = { version = "4.6.6", features = ["derive"] }
db = { version = "0.0.1", path = "../db" }
mountfs = { path = "../mountfs" }
store = { version = "0.0.1", path = "../store" }
time = { version = "0.3.55", features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }
